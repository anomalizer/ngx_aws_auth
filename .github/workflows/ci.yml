name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_and_test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu-2604-x86_64-gcc
            runner: ubuntu-latest
            image: ubuntu:26.04
            packages: apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y libpcre2-dev zlib1g-dev libssl-dev build-essential wget git cmake
            cc: gcc
            cc_opt: ''
          - name: ubuntu-2404-aarch64-clang
            runner: ubuntu-24.04-arm
            image: ubuntu:24.04
            packages: apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y libpcre2-dev zlib1g-dev libssl-dev build-essential wget git cmake clang
            cc: clang
            cc_opt: ''
          - name: fedora-x86_64-gcc
            runner: ubuntu-latest
            image: fedora:latest
            packages: dnf install -y gcc make cmake wget git binutils findutils tar gzip openssl-devel pcre2-devel zlib-devel
            cc: gcc
            cc_opt: ''
          - name: alpine-x86_64-clang
            runner: ubuntu-latest
            image: alpine:latest
            # musl's CMSG_NXTHDR triggers -Wsign-compare under nginx's -Werror
            # when built with clang; keep the warning but don't fail the build.
            packages: apk add --no-cache build-base wget git cmake clang openssl-dev pcre2-dev zlib-dev linux-headers
            cc: clang
            cc_opt: -Wno-error=sign-compare
    steps:
      - name: Install dependencies
        run: ${{ matrix.packages }}
      - uses: actions/checkout@v5
      - name: Build and test
        run: |
          # the workspace is owned by the runner user while git runs as root
          # inside the container
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          export NGINX_VERSION=1.30.5
          export CC='${{ matrix.cc }}'
          export NGX_CC_OPT='${{ matrix.cc_opt }}'
          make prepare-nginx nginx test

  # JavaScript actions (including checkout) are unsupported in alpine
  # containers on arm64 runners, so this target runs the build via docker
  # on the host instead of in a job container.
  alpine_arm:
    name: alpine-aarch64-gcc
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5
      - name: Build and test in alpine container
        run: |
          docker run --rm -v "$PWD":/src -w /src alpine:latest sh -c '
            apk add --no-cache build-base wget git cmake openssl-dev pcre2-dev zlib-dev linux-headers &&
            git config --global --add safe.directory /src &&
            export NGINX_VERSION=1.30.5 CC=gcc &&
            make prepare-nginx nginx test'

  all-targets:
    needs: [build_and_test, alpine_arm]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Matrix summary
        run: |
          test "${{ needs.build_and_test.result }}" = success
          test "${{ needs.alpine_arm.result }}" = success
          echo "all target jobs passed"